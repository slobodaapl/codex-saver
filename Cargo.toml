[package]
name = "codex-saver"
version = "0.1.3"
edition = "2024"

[dependencies]
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
uuid = { version = "1", features = ["serde"] }
rustix = { version = "1", features = ["process", "fs", "time"] }
